<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>PARC Fresh v3.3 — Responsive QA Harness</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:24px;background:#111816;color:#f7f2e9;font:15px/1.4 system-ui,sans-serif}
    h1{margin:0 0 6px;font-size:22px}
    p{margin:0 0 20px;color:#cbd4cf}
    .frames{display:flex;align-items:flex-start;gap:24px;overflow-x:auto;padding-bottom:18px}
    figure{flex:0 0 auto;margin:0}
    figcaption{margin-bottom:8px;font-weight:700}
    iframe{display:block;border:1px solid #6f7d77;border-radius:10px;background:#f7f2e9}
    .w390{width:390px;height:844px}
    .w320{width:320px;height:700px}
    .status{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:999px;background:#293a34;color:#cbd4cf;font-size:12px}
    .status[data-result="pass"]{background:#365e55;color:#fff}
    .status[data-result="fail"]{background:#792b50;color:#fff}
  </style>
</head>
<body>
  <h1>Responsive production QA</h1>
  <p>Same-origin frames load the current <code>index.html</code>; this page is not part of the executive report.</p>
  <div class="frames">
    <figure>
      <figcaption>390 × 844 · page</figcaption>
      <iframe class="w390" title="390 px production viewport" src="../index.html?qa=mobile-dialog-v3-3"></iframe>
    </figure>
    <figure>
      <figcaption>320 × 700 · page</figcaption>
      <iframe class="w320" title="320 px production viewport" src="../index.html?qa=mobile-dialog-v3-3"></iframe>
    </figure>
    <figure>
      <figcaption>390 × 844 · detail modal <span class="status">checking</span></figcaption>
      <iframe class="w390" data-state="detail" title="390 px competitor detail modal" src="../index.html?qa=modal-detail-v3-3"></iframe>
    </figure>
    <figure>
      <figcaption>320 × 700 · research modal <span class="status">checking</span></figcaption>
      <iframe class="w320" data-state="research" title="320 px competitor research modal" src="../index.html?qa=modal-research-v3-3"></iframe>
    </figure>
  </div>
  <script>
    document.querySelectorAll("iframe[data-state]").forEach((frame) => {
      let attempts = 0;
      const status = frame.previousElementSibling.querySelector(".status");
      const retry = () => {
        if (attempts < 60) window.setTimeout(inspectState, 100);
        else {
          status.dataset.result = "fail";
          status.textContent = "fail";
        }
      };
      const inspectState = () => {
        attempts += 1;
        const doc = frame.contentDocument;
        if (!doc?.body?.dataset?.interfaceRelease) {
          retry();
          return;
        }
        const detailButton = doc.querySelector('[data-competitor-button][data-candidate-ref="A"][data-competitor-index="2"]');
        if (!detailButton) {
          retry();
          return;
        }
        const dialog = doc.querySelector("dialog");
        if (!dialog?.open) {
          const details = detailButton.closest("details");
          if (details) details.open = true;
          detailButton.click();
          retry();
          return;
        }
        const expectedBack = frame.dataset.state === "research";
        const back = doc.querySelector("[data-research-back]");
        if (expectedBack && back?.hidden) {
          doc.querySelector("[data-open-research]")?.click();
          retry();
          return;
        }
        if (expectedBack && doc.querySelector('[data-research-intent="tenant"]')?.getAttribute("aria-pressed") !== "true") {
          doc.querySelector('[data-research-intent="tenant"]')?.click();
          retry();
          return;
        }
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const heading = doc.querySelector(".dialog-heading");
          const title = doc.querySelector("[data-dialog-title]");
          const close = doc.querySelector("[data-dialog-close]");
          const headingBox = heading?.getBoundingClientRect();
          const closeBox = close?.getBoundingClientRect();
          const selectedIntent = doc.querySelector('.intent-button[aria-pressed="true"]');
          const selectedStrong = selectedIntent?.querySelector("strong");
          const selectedDescription = selectedIntent?.querySelector("span span");
          const routeCounts = [...doc.querySelectorAll("[data-research-intent]")].reduce((counts, button) => {
            counts[button.dataset.route] = (counts[button.dataset.route] || 0) + 1;
            return counts;
          }, {});
          const researchLink = doc.querySelector("[data-google-link]");
          const researchUrl = researchLink ? new URL(researchLink.href) : null;
          const query = doc.querySelector("[data-research-query]")?.value || "";
          const routeStateOk = !expectedBack || Boolean(
            routeCounts.search === 2 &&
            routeCounts.ai === 2 &&
            selectedIntent?.dataset.researchIntent === "tenant" &&
            researchLink?.dataset.route === "ai" &&
            researchUrl?.searchParams.get("udm") === "50" &&
            doc.querySelector("[data-query-label]")?.textContent.includes("AI Mode") &&
            query.includes("อ้างอิง") &&
            query.includes("วันที่")
          );
          const selectedStateOk = !expectedBack || Boolean(
            selectedIntent && selectedStrong && selectedDescription &&
            frame.contentWindow.getComputedStyle(selectedStrong).color ===
              frame.contentWindow.getComputedStyle(selectedIntent).color &&
            frame.contentWindow.getComputedStyle(selectedStrong).color !==
              frame.contentWindow.getComputedStyle(selectedDescription).color
          );
          const passed = Boolean(
            headingBox && closeBox &&
            headingBox.width >= 120 &&
            closeBox.left > headingBox.left &&
            frame.contentWindow.getComputedStyle(title).outlineStyle === "none" &&
            Boolean(!back.hidden) === expectedBack &&
            selectedStateOk &&
            routeStateOk
          );
          if (!passed && attempts < 60) {
            retry();
            return;
          }
          status.dataset.result = passed ? "pass" : "fail";
          status.textContent = passed ? "pass" : "fail";
        }));
      };
      if (frame.contentDocument?.readyState === "complete") inspectState();
      else frame.addEventListener("load", inspectState, { once: true });
    });
  </script>
</body>
</html>
